<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barcode to Excel</title>
<meta name="theme-color" content="#0f7a4f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<style>
  :root{
    --bg:#f4f6f5; --card:#fff; --ink:#17201c; --muted:#5f6b66; --line:#dfe5e2;
    --accent:#0f7a4f; --accent-ink:#fff; --warn:#b45309; --bad:#b91c1c; --ok:#15803d;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f1412; --card:#18201c; --ink:#e8efeb; --muted:#9aa8a1; --line:#2a3530;
      --accent:#2fb37a; --accent-ink:#06130d; --warn:#f59e0b; --bad:#f87171; --ok:#4ade80; }
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{padding:18px 16px 6px;max-width:720px;margin:0 auto}
  header h1{margin:0;font-size:22px}
  header p{margin:4px 0 0;color:var(--muted);font-size:14px}
  main{max-width:720px;margin:0 auto;padding:8px 16px 40px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
  .card h2{margin:0 0 12px;font-size:16px}
  .btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:10px;padding:11px 14px;font:inherit;font-weight:600;cursor:pointer}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .btn.big{width:100%;padding:16px;font-size:18px}
  .btn:disabled{opacity:.5;cursor:default}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row > *{flex:1 1 140px}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px;font-weight:600}
  input[type=text],input[type=password],input[type=date],input[type=number]{width:100%;padding:11px 12px;border:1px solid var(--line);
    border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
  input:focus{outline:2px solid var(--accent);outline-offset:1px}
  .photoWrap{display:none;margin-top:10px;gap:12px;align-items:flex-start}
  .thumb{width:80px;height:80px;flex:0 0 80px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
  .status{font-size:14px;color:var(--muted);flex:1}
  .seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg input{position:absolute;opacity:0;pointer-events:none}
  .seg label{flex:1;margin:0;padding:10px 6px;text-align:center;font-size:14px;color:var(--ink);cursor:pointer;background:var(--bg)}
  .seg input:checked + label{background:var(--accent);color:var(--accent-ink)}
  .seg input:disabled + label{opacity:.45;cursor:default}
  .aibox{margin-top:10px;padding:12px;border:1px dashed var(--line);border-radius:10px}
  .aibox label:first-child{margin-top:0}
  #camModal{position:fixed;inset:0;background:#000;display:none;flex-direction:column;z-index:50}
  #camModal.show{display:flex}
  #camModal video{flex:1;width:100%;object-fit:cover;min-height:0}
  #camFrame{position:absolute;left:8%;right:8%;top:30%;height:26%;border:3px solid rgba(255,255,255,.9);border-radius:14px;box-shadow:0 0 0 9999px rgba(0,0,0,.35);pointer-events:none}
  #camMsg{position:absolute;top:calc(env(safe-area-inset-top) + 16px);left:16px;right:16px;color:#fff;text-align:center;font-weight:600;text-shadow:0 1px 3px #000}
  #camBar{display:flex;gap:10px;padding:14px 16px calc(env(safe-area-inset-bottom) + 14px);background:#000}
  #camBar .btn{flex:1}
  .chk{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:14px;color:var(--muted)}
  .hint{font-size:13px;color:var(--muted);margin:8px 0 0}
  .list{display:flex;flex-direction:column;gap:8px}
  .item{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;gap:10px;align-items:flex-start}
  .item .info{flex:1;min-width:0}
  .item .name{font-weight:700;overflow-wrap:anywhere}
  .item .meta{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
  .badge{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;margin-top:4px;border:1px solid currentColor}
  .badge.ok{color:var(--ok)} .badge.warn{color:var(--warn)} .badge.bad{color:var(--bad)}
  .item .acts{display:flex;flex-direction:column;gap:6px}
  .item .acts .btn{padding:6px 10px;font-size:13px}
  .empty{color:var(--muted);text-align:center;padding:16px 0}
  #toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);
    padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
  #toast.show{opacity:1}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:20px}
  .modal.show{display:flex}
  .modal .box{background:var(--card);border-radius:14px;padding:18px;max-width:360px;width:100%}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s 1s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes s{to{transform:rotate(360deg)}}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .lang{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .lang button{appearance:none;border:0;background:var(--card);color:var(--ink);font:inherit;font-size:14px;font-weight:600;padding:8px 12px;cursor:pointer}
  .lang button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
  .withbtn{display:flex;gap:8px}
  .withbtn input{flex:1;min-width:0}
  .btn.scan{white-space:nowrap;padding:8px 12px;font-size:14px}
  .hint a{color:var(--accent);font-weight:600}
  .hint.good{color:var(--ok)} .hint.bad{color:var(--bad)}
  [dir=rtl] input[dir=ltr]{text-align:right}
  .stock{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .stock span{flex:1 1 180px}
  .badge.out{color:var(--muted)}
  .badges{display:flex;gap:6px;flex-wrap:wrap}
  .filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .filters button{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
  .filters button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1 data-i18n="title">Barcode → Excel</h1>
    <div class="lang" role="group" aria-label="Language / اللغة">
      <button type="button" data-lang="en">English</button>
      <button type="button" data-lang="ar">العربية</button>
    </div>
  </div>
  <p data-i18n="subtitle"></p>
</header>
<main>

  <section class="card">
    <h2 data-i18n="scanItem"></h2>
    <div class="row" style="flex-wrap:nowrap">
      <button class="btn primary big" type="button" id="cam1Btn" style="flex:3" data-i18n="scanBarcode"></button>
      <label class="btn big" for="cam1" style="flex:1;text-align:center;font-size:15px" data-i18n="photo" data-i18n-title="photoTitle"></label>
    </div>
    <input id="cam1" type="file" accept="image/*" capture="environment" hidden>
    <div id="wrap1" class="photoWrap">
      <img id="photo1" class="thumb" alt="">
      <div id="status1" class="status"></div>
    </div>
    <div class="row" style="flex-wrap:nowrap;margin-top:12px">
      <button class="btn big" type="button" id="cam2Btn" style="flex:3" data-i18n="captureDates"></button>
      <label class="btn big" for="cam2" style="flex:1;text-align:center;font-size:15px" data-i18n="photo" data-i18n-title="photoTitle"></label>
    </div>
    <input id="cam2" type="file" accept="image/*" capture="environment" hidden>
    <div id="wrap2" class="photoWrap">
      <img id="photo2" class="thumb" alt="">
      <div id="status2" class="status"></div>
    </div>
    <label style="margin-top:14px" data-i18n="readUsing"></label>
    <div class="seg">
      <input type="radio" name="engine" id="engLocal" value="local" checked><label for="engLocal" data-i18n="offline"></label>
      <input type="radio" name="engine" id="engOpenai" value="openai"><label for="engOpenai">ChatGPT</label>
      <input type="radio" name="engine" id="engGemini" value="gemini"><label for="engGemini">Gemini</label>
    </div>
    <div id="aiBox" class="aibox" style="display:none">
      <label for="aiKey" id="aiKeyLbl"></label>
      <input id="aiKey" type="password" autocomplete="off" spellcheck="false" dir="ltr" data-i18n-ph="pasteKey">
      <div class="row" style="margin-top:8px;align-items:center">
        <button class="btn primary" type="button" id="aiTest" style="flex:0 0 auto" data-i18n="testAi"></button>
        <p class="hint" id="aiTestMsg" style="margin:0;flex:1 1 160px" role="status"></p>
      </div>
      <p class="hint"><span id="aiHelp"></span> <a id="aiLink" target="_blank" rel="noopener" data-i18n="getKey"></a></p>
      <label for="aiModel" data-i18n="model"></label>
      <input id="aiModel" type="text" autocomplete="off" spellcheck="false" dir="ltr">
      <p class="hint" data-i18n="keyPrivacy"></p>
    </div>
    <div class="hint" id="ocrState"></div>
    <p class="hint" data-i18n-html="scanTips"></p>
  </section>

  <section class="card">
    <h2 data-i18n="details"></h2>
    <form id="form" autocomplete="off">
      <label for="f_name" data-i18n="name"></label>
      <input id="f_name" type="text" data-i18n-ph="namePh">
      <label for="f_code" data-i18n="code"></label>
      <input id="f_code" type="text" inputmode="numeric" dir="ltr" data-i18n-ph="codePh">
      <div id="stockNote" class="stock" hidden></div>
      <div class="row">
        <div>
          <label for="f_prod" data-i18n="prod"></label>
          <div class="withbtn">
            <input id="f_prod" type="date" dir="ltr">
            <button class="btn scan" type="button" data-scan="prod" data-i18n="scanThis" data-i18n-title="scanProdTitle"></button>
          </div>
        </div>
        <div>
          <label for="f_exp" data-i18n="exp"></label>
          <div class="withbtn">
            <input id="f_exp" type="date" dir="ltr">
            <button class="btn scan" type="button" data-scan="exp" data-i18n="scanThis" data-i18n-title="scanExpTitle"></button>
          </div>
        </div>
      </div>
      <div class="row">
        <div>
          <label for="f_in" data-i18n="dateIn"></label>
          <div class="withbtn">
            <input id="f_in" type="datetime-local" dir="ltr">
            <button class="btn scan" type="button" data-now="in" data-i18n="now"></button>
          </div>
        </div>
        <div>
          <label for="f_out" data-i18n="dateOut"></label>
          <div class="withbtn">
            <input id="f_out" type="datetime-local" dir="ltr">
            <button class="btn scan" type="button" data-now="out" data-i18n="now"></button>
          </div>
        </div>
      </div>
      <div class="row">
        <div>
          <label for="f_batch" data-i18n="batch"></label>
          <input id="f_batch" type="text" dir="ltr">
        </div>
        <div>
          <label for="f_qty" data-i18n="qty"></label>
          <input id="f_qty" type="number" min="0" step="1" value="1" dir="ltr">
        </div>
      </div>
      <div class="row" style="margin-top:14px">
        <button class="btn primary" type="submit" id="saveBtn"></button>
        <button class="btn" type="button" id="clearBtn" data-i18n="clear"></button>
      </div>
    </form>
  </section>

  <section class="card">
    <div class="row" style="align-items:center;margin-bottom:10px">
      <h2 style="margin:0;flex:1 1 auto"><span data-i18n="saved"></span> (<span id="count">0</span>)</h2>
    </div>
    <div class="row" style="margin-bottom:12px">
      <button class="btn primary" id="xlsxBtn" data-i18n="export"></button>
      <button class="btn" id="copyBtn" data-i18n="copy"></button>
      <button class="btn" id="wipeBtn" data-i18n="wipe"></button>
    </div>
    <div class="filters" role="group">
      <button type="button" data-filter="all" data-i18n="fAll"></button>
      <button type="button" data-filter="in" data-i18n="fIn"></button>
      <button type="button" data-filter="out" data-i18n="fOut"></button>
    </div>
    <div class="list" id="list"></div>
    <p class="hint" data-i18n="keptHint"></p>
  </section>
</main>

<div id="camModal">
  <video id="camVideo" playsinline muted></video>
  <div id="camFrame"></div>
  <div id="camMsg"></div>
  <div id="camBar">
    <button class="btn" type="button" id="camClose" data-i18n="close"></button>
    <button class="btn" type="button" id="camTorch" style="display:none" data-i18n="light"></button>
    <button class="btn primary" type="button" id="camShot" data-i18n="capture"></button>
  </div>
</div>
<div id="toast"></div>
<div class="modal" id="confirm">
  <div class="box">
    <p id="confirmText" style="margin:0 0 16px"></p>
    <div class="row">
      <button class="btn" id="confirmNo" data-i18n="cancel"></button>
      <button class="btn primary" id="confirmYes" style="background:var(--bad);border-color:var(--bad);color:#fff" data-i18n="del"></button>
    </div>
  </div>
</div>

  // --- image clean-up variants (help with dotted / faint print) ---
  function grayOf(img, maxSide){
    const c=toCanvas(img,maxSide), x=c.getContext('2d',{willReadFrequently:true});

  function minFilter({w,h,g}, r){ // grows dark dots so they join into strokes
    const t=new Uint8ClampedArray(g.length), o=new Uint8ClampedArray(g.length);

    for(let y=0;y<h;y++) for(let x=0;x<w;x++){ let m=255; for(let k=-r;k<=r;k++){ const yy=Math.min(h-1,Math.max(0,y+k)); const v=t[yy*w+x]; if(v<m)m=v; } o[y*w+x]=m; }

  function boxBlur({w,h,g}, r){

    for(let t=0;t<256;t++){ wB+=hist[t]; if(!wB) continue; const wF=n-wB; if(!wF) break;

          fill(pick(validDate(v.production_date), validDate(v.expiry_date)));
          if(v.batch && !F.batch.value) F.batch.value=v.batch;
        }catch(err){ aiError(err); }
      } else {
        setS(2,pre()+'<span class="spin"></span>'+t('phoneDates'));
        try{
          const p0=pre();
          const v=await ocrDates(img,(i,n)=>setS(2,p0+'<span class="spin"></span>'+t('phoneDates')+' '+t('tryN',{i,n})));
          fill(pick(v.prod, v.exp));
        }catch(err){ toast(t('ocrOff')); }
      }
    }
    let msg = found.length?'✅ '+t('found',{x:esc(found.join(', '))}):t('datesNotRead');
    if(!aiOn() && lastOcrText) msg += `<details style="margin-top:6px"><summary>${esc(t('phoneText'))}</summary><pre style="white-space:pre-wrap;font-size:12px;margin:4px 0 0" dir="ltr">${esc(lastOcrText.slice(0,1200))}</pre></details>`;
    setS(2, msg, true);
    $('cam2Btn').classList.remove('primary'); $('cam1Btn').classList.add('primary');
    (!F.name.value?F.name:!F.exp.value?F.exp:$('saveBtn')).focus();
  }

  // Scanner-gun / typed barcode: fill remembered name
  F.code.addEventListener('change', ()=>{
    const g=parseGS1(F.code.value);
    if(g){ F.code.value=g.code; if(g.prod) F.prod.value=g.prod; if(g.exp) F.exp.value=g.exp; if(g.batch) F.batch.value=g.batch; }
    const c=F.code.value.trim(); if(c && names[c] && !F.name.value) F.name.value=names[c];
    checkStock();
  });
  F.code.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); F.code.dispatchEvent(new Event('change')); (checkStock()?$('stockNote').querySelector('button'):F.name.value?F.exp:F.name).focus(); }});

  // ---------- save / edit ----------
  function clearForm(){
    Object.values(F).forEach(i=>i.value=''); F.qty.value='1'; F.in.value=nowLocal(); editingId=null;
    $('saveBtn').textContent=t('save'); $('stockNote').hidden=true;
    [1,2].forEach(n=>{ $('wrap'+n).style.display='none'; $('status'+n).innerHTML=''; delete $('status'+n).dataset.base; });
    $('cam1Btn').classList.add('primary'); $('cam2Btn').classList.remove('primary');
  }
  $('clearBtn').onclick=clearForm;
  document.querySelectorAll('[data-now]').forEach(b=>b.onclick=()=>{ F[b.dataset.now].value=nowLocal(); });
  $('form').addEventListener('submit', e=>{
    e.preventDefault();
    const rec={ name:F.name.value.trim(), code:F.code.value.trim(), prod:F.prod.value, exp:F.exp.value, in:F.in.value, out:F.out.value,
      batch:F.batch.value.trim(), qty:F.qty.value===''?'':Number(F.qty.value) };
    if(!rec.name && !rec.code){ toast(t('needNameOrCode')); F.name.focus(); return; }
    if(rec.prod && rec.exp && rec.prod>rec.exp){ toast(t('prodAfterExp')); return; }
    if(!rec.in){ toast(t('needIn')); F.in.focus(); return; }
    if(rec.out && rec.out<rec.in){ toast(t('outBeforeIn')); F.out.focus(); return; }
    if(editingId){
      const i=items.findIndex(x=>x.id===editingId); if(i>=0) items[i]={...items[i],...rec};
      toast(t('itemUpdated'));
    } else {
      items.unshift({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6), added:new Date().toISOString(), ...rec});
      toast(t('itemSaved'));
    }
    if(rec.code && rec.name) names[rec.code]=rec.name;
    persist(); render(); clearForm();
  });

  function badge(it){
    const d=daysIn(it); if(d===null) return '';
    return it.out ? `<span class="badge out">${esc(t('stayed',{n:d}))}</span>` : `<span class="badge ok">${esc(t('inSince',{n:d}))}</span>`;
  }
  function daysLeft(exp){
    if(!exp) return null;
    const t=new Date(); t.setHours(0,0,0,0);
    const [y,m,d]=exp.split('-').map(Number);
    return Math.round((new Date(y,m-1,d)-t)/86400000);
  }
  function expBadge(exp){
    const d=daysLeft(exp); if(d===null) return '';
    if(d<0) return `<span class="badge bad">${esc(t('expiredAgo',{n:-d}))}</span>`;
    if(d<=30) return `<span class="badge warn">${esc(t('expiresIn',{n:d}))}</span>`;
    return `<span class="badge ok">${esc(t('daysLeft',{n:d}))}</span>`;
  }
  let filter='all';
  function render(){
    $('count').textContent=items.length;
    const L=$('list');
    document.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.filter===filter)));
    const shown=items.filter(it=>filter==='all'||(filter==='in')===!it.out);
    if(!shown.length){ L.innerHTML=`<div class="empty">${esc(t(items.length?'emptyFilter':'empty'))}</div>`; return; }
    L.innerHTML=shown.map(it=>`
      <div class="item">
        <div class="info">
          <div class="name">${esc(it.name||t('noName'))}</div>
          <div class="meta">🔢 <bdi>${esc(it.code||'—')}</bdi>${it.qty!==''&&it.qty!=null?` · ${esc(t('qtyShort'))} ${esc(it.qty)}`:''}${it.batch?` · ${esc(t('lot'))} <bdi>${esc(it.batch)}</bdi>`:''}</div>
          <div class="meta">🏭 ${esc(t('prodW'))}: <bdi>${esc(it.prod||'—')}</bdi> &nbsp; ⏳ ${esc(t('expW'))}: <bdi>${esc(it.exp||'—')}</bdi></div>
          <div class="meta">📥 ${esc(t('inW'))}: <bdi>${esc(showDT(it.in))}</bdi> &nbsp; 📤 ${esc(t('outW'))}: <bdi>${esc(showDT(it.out))}</bdi></div>
          <div class="badges">${expBadge(it.exp)}${badge(it)}</div>
        </div>
        <div class="acts">
          ${it.out?'':`<button class="btn primary" data-checkout="${it.id}">${esc(t('checkout'))}</button>`}
          <button class="btn" data-edit="${it.id}">${esc(t('edit'))}</button>
          <button class="btn" data-del="${it.id}">${esc(t('del'))}</button>
        </div>
      </div>`).join('');
  }
  $('list').addEventListener('click', async e=>{
    const ed=e.target.closest('[data-edit]'), dl=e.target.closest('[data-del]'), co=e.target.closest('[data-checkout]');
    if(co) checkout(co.dataset.checkout);
    if(ed){
      const it=items.find(x=>x.id===ed.dataset.edit); if(!it) return;
      editingId=it.id; F.name.value=it.name||''; F.code.value=it.code||''; F.prod.value=it.prod||''; F.exp.value=it.exp||''; F.in.value=it.in||'';
      F.out.value=it.out||''; F.batch.value=it.batch||''; F.qty.value=it.qty??''; $('stockNote').hidden=true;
      $('saveBtn').textContent=t('update'); $('form').scrollIntoView({behavior:'smooth'}); F.name.focus();
    }
    if(dl){
      if(await ask(t('askDel'))){ items=items.filter(x=>x.id!==dl.dataset.del); persist(); render(); }
    }
  });
  document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{ filter=b.dataset.filter; render(); });
  $('wipeBtn').onclick=async()=>{
    if(!items.length) return;
    if(await ask(t('askWipe',{n:items.length}))){ items=[]; persist(); render(); }
  };

  // ---------- export ----------
  // Excel date serials written directly: JS Date objects pick up the time zone's historical offset (e.g. +52s in Riyadh)
  const serial = s => { const d=parseLocal(s); return (Date.UTC(d.getFullYear(),d.getMonth(),d.getDate(),d.getHours(),d.getMinutes())-Date.UTC(1899,11,30))/86400000; };
  const dateCell = s => s ? {t:'n', v:serial(s), z:'yyyy-mm-dd hh:mm'} : '';
  const dayCell = s => s ? {t:'n', v:serial(s), z:'yyyy-mm-dd'} : '';
  const statusOf = it => t(it.out?'fOut':'fIn');
  function rows(forExcel){
    return items.slice().reverse().map((it,i)=>{
      const days=daysIn(it)??'', left=daysLeft(it.exp)??'', r=i+2;
      if(!forExcel) return [i+1, it.name||'', it.code||'', it.prod||'', it.exp||'', left, showDT(it.in), it.out?showDT(it.out):'', days, statusOf(it), it.batch||'', it.qty??''];
      return [
        i+1, it.name||'',
        {t:'s', v:String(it.code||'')}, // text so Excel doesn't turn barcodes into 6.28E+12
        dayCell(it.prod), dayCell(it.exp),
        it.exp ? {t:'n', v:left, f:`E${r}-TODAY()`, z:'0'} : '', // live, so the sheet stays right on later days
        dateCell(it.in), dateCell(it.out),
        // live: items still in the warehouse keep counting up when the file is opened later
        it.in ? {t:'n', v:days, f: it.out ? `INT(H${r})-INT(G${r})` : `TODAY()-INT(G${r})`, z:'0'} : '',
        statusOf(it), it.batch||'', it.qty??''
      ];
    });
  }
  $('xlsxBtn').onclick=async()=>{
    if(!items.length){ toast(t('noItems')); return; }
    if(!window.XLSX){ toast(t('xlsxMissing')); return; }
    const ws=XLSX.utils.aoa_to_sheet([t('head'),...rows(true)]);
    ws['!cols']=[{wch:5},{wch:34},{wch:18},{wch:16},{wch:16},{wch:10},{wch:18},{wch:18},{wch:12},{wch:14},{wch:14},{wch:10}];
    ws['!autofilter']={ref:`A1:L${items.length+1}`};
    const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,t('sheet'));
    if(lang==='ar') wb.Workbook={Views:[{RTL:true}]};
    const buf=XLSX.write(wb,{type:'array',bookType:'xlsx'});
    const stamp=new Date().toISOString().slice(0,10);
    const url=URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
    const link=document.createElement('a'); link.href=url; link.download=`items-${stamp}.xlsx`;
    document.body.appendChild(link); link.click(); link.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    toast(t('downloaded'));
  };
  $('copyBtn').onclick=async()=>{
    if(!items.length){ toast(t('noCopy')); return; }
    const tsv=[t('head'),...rows(false)].map(r=>r.map(v=>String(v).replace(/[\t\n]/g,' ')).join('\t')).join('\n');
    try{ await navigator.clipboard.writeText(tsv); toast(t('copied')); }
    catch(e){ toast(t('copyBlocked')); }
  };

  applyLang(); clearForm(); render();
  document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{
    lang=b.dataset.lang; try{ localStorage.setItem('b2x_lang',lang); }catch(e){}
    applyLang(); $('saveBtn').textContent=t(editingId?'update':'save'); render(); showEngine(); refreshNotes(); checkStock();
  }));
  function showEngine(){
    const p=engine();
    if(p==='local'){ $('aiBox').style.display='none'; if(ocrKey) ocrState(ocrKey); initOCR(); return; }
    $('aiBox').style.display='block'; if($('aiBox').dataset.p!==p){ $('aiTestMsg').textContent=''; $('aiBox').dataset.p=p; }
    $('aiKeyLbl').textContent=t(AI[p].label); $('aiHelp').textContent=t(AI[p].help); $('aiLink').href=AI[p].link;
    $('aiKey').value=aiKey(p); $('aiModel').value=aiModel(p); $('aiModel').placeholder=AI[p].model;
    $('ocrState').textContent = aiKey(p) ? t('aiReady',{p:p==='openai'?'ChatGPT':'Gemini'}) : t('aiNoKey');
  }
  $('aiKey').addEventListener('input',()=>{ store2.set('b2x_key_'+engine(), $('aiKey').value.trim()); $('aiTestMsg').textContent='';
    $('ocrState').textContent = aiKey(engine()) ? t('aiReady',{p:engine()==='openai'?'ChatGPT':'Gemini'}) : t('aiNoKey'); });
  $('aiKey').addEventListener('change',()=>{ if($('aiKey').value.trim()) testAI(); });
  $('aiTest').addEventListener('click',testAI);
  $('aiModel').addEventListener('change',()=>{ store2.set('b2x_model_'+engine(), $('aiModel').value.trim()); });
  { const saved=store2.get('b2x_engine'); const el=document.querySelector(`input[name=engine][value="${saved}"]`); if(el) el.checked=true; }
  document.querySelectorAll('input[name=engine]').forEach(r=>r.addEventListener('change',()=>{ store2.set('b2x_engine', engine()); showEngine(); }));
  setTimeout(showEngine, 400);

  // ---------- Live camera ----------
  let stream=null, camMode=null, camLoop=null, busy=false;
  const camMsg=t=>{ $('camMsg').textContent=t; };
  async function openCam(mode){
    camMode=mode;
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ toast(t('camNA')); return; }
    try{
      stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}});
    }catch(e){ toast(t('camDenied')); if(mode!=='barcode'){ dateTarget=mode==='dates'?null:mode; $('cam2').click(); } return; }
    const v=$('camVideo'); v.srcObject=stream; await v.play().catch(()=>{});
    $('camModal').classList.add('show');
    const track=stream.getVideoTracks()[0], caps=track.getCapabilities?track.getCapabilities():{};
    $('camTorch').style.display=caps.torch?'':'none';
    if(caps.focusMode && caps.focusMode.includes('continuous')) track.applyConstraints({advanced:[{focusMode:'continuous'}]}).catch(()=>{});
    if(mode==='barcode'){
      $('camFrame').style.cssText='top:32%;height:22%'; $('camShot').style.display='none';
      camMsg(t('camBarcode'));
      startBarcodeLoop();
    } else {
      $('camFrame').style.cssText=mode==='dates'?'top:28%;height:30%':'top:34%;height:18%'; $('camShot').style.display='';
      camMsg(t(mode==='prod'?'camProd':mode==='exp'?'camExp':'camDates'));
    }
  }
  function closeCam(){
    clearTimeout(camLoop); camLoop=null;
    if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
    $('camModal').classList.remove('show');
  }
  function frameCanvas(cropToBox){
    const v=$('camVideo'), vw=v.videoWidth, vh=v.videoHeight; if(!vw) return null;
    const c=document.createElement('canvas');
    if(!cropToBox){ c.width=vw; c.height=vh; c.getContext('2d').drawImage(v,0,0); return c; }
    // map the on-screen box to video pixels (video uses object-fit: cover)
    const r=v.getBoundingClientRect(), f=$('camFrame').getBoundingClientRect();
    const sc=Math.max(r.width/vw, r.height/vh), ox=(vw*sc-r.width)/2, oy=(vh*sc-r.height)/2;
    let x=(f.left-r.left+ox)/sc, y=(f.top-r.top+oy)/sc, w=f.width/sc, h=f.height/sc;
    const pad=0.12; x-=w*pad; y-=h*pad; w*=1+2*pad; h*=1+2*pad;
    x=Math.max(0,x); y=Math.max(0,y); w=Math.min(vw-x,w); h=Math.min(vh-y,h);
    c.width=Math.round(w); c.height=Math.round(h);
    c.getContext('2d').drawImage(v,x,y,w,h,0,0,c.width,c.height); return c;
  }
  const canvasToImg = c => new Promise(res=>{ const im=new Image(); im.onload=()=>res(im); im.src=c.toDataURL('image/jpeg',0.92); });
  function startBarcodeLoop(){
    let det=null; try{ if('BarcodeDetector' in window) det=new BarcodeDetector(); }catch(e){}
    const Z=window.ZXing; let reader=null;
    if(Z){ const hints=new Map(); hints.set(Z.DecodeHintType.TRY_HARDER,true); reader=new Z.MultiFormatReader(); reader.setHints(hints); }
    const tick=async()=>{
      if(!stream) return;
      let raw=null;
      try{
        if(det){ const r=await det.detect($('camVideo')); if(r&&r.length) raw=r[0].rawValue; }
        if(!raw && reader){
          const c=frameCanvas(true);
          if(c){ try{ raw=reader.decode(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(c)))).getText(); }catch(e){} }
        }
      }catch(e){}
      if(raw){
        try{ navigator.vibrate && navigator.vibrate(80); }catch(e){}
        const c=frameCanvas(false); closeCam();
        handleBarcode(raw, c ? await canvasToImg(c) : null);
        return;
      }
      camLoop=setTimeout(tick, det?120:250);
    };
    tick();
  }
  $('cam1Btn').onclick=()=>openCam('barcode');
  $('cam2Btn').onclick=()=>openCam('dates');
  $('camClose').onclick=closeCam;
  document.querySelectorAll('[data-scan]').forEach(b=>b.onclick=()=>openCam(b.dataset.scan));
  $('camShot').onclick=async()=>{
    const mode=camMode, c=frameCanvas(true); closeCam(); if(!c) return;
    const img=await canvasToImg(c);
    $('photo2').src=img.src; $('wrap2').style.display='flex';
    handleDates(img, mode==='prod'||mode==='exp' ? mode : null);
  };
  $('camTorch').onclick=()=>{
    if(!stream) return; const t=stream.getVideoTracks()[0]; const on=!t._torch; t._torch=on;
    t.applyConstraints({advanced:[{torch:on}]}).catch(()=>{});
  };

  // ---------- installable app ----------
  if('serviceWorker' in navigator && location.protocol==='https:'){
    window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
  }
})();
</script>
</body>
